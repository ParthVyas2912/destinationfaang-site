# Re-fetch daily (and on demand); deploy.yml publishes successful refreshes.
# Requires two repository secrets:
#   YT_API_KEY  - your YouTube Data API v3 key
#   YT_CHANNEL_ID - your channel ID (UC...)
name: Refresh videos.json

on:
  schedule:
    - cron: "17 6 * * *"   # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-videos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch & categorize videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch_videos.py --channel-id "${{ secrets.YT_CHANNEL_ID }}"
      - name: Regenerate SEO assets
        run: python build_seo.py
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json index.html sitemap.xml robots.txt v
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: refresh videos.json and SEO assets"
            git push
          fi
