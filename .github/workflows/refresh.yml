# Re-fetch the channel weekly (and on demand) so new uploads appear automatically.
# Requires two repository secrets:
#   YT_API_KEY  - your YouTube Data API v3 key
#   YT_CHANNEL_ID - your channel ID (UC...)
name: Refresh videos.json

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch & categorize videos
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python fetch_videos.py --channel-id "${{ secrets.YT_CHANNEL_ID }}"
      - name: Regenerate SEO assets
        run: python build_seo.py
      - name: Commit changes if any
        run: |
          if ! git diff --quiet videos.json index.html sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add videos.json index.html sitemap.xml robots.txt
            git commit -m "chore: refresh videos.json and SEO assets"
            git push
          else
            echo "No changes."
          fi
