name: Update YouTube titles & descriptions

on:
  schedule:
    # YouTube API quota resets at midnight Pacific. Run daily at 09:15 UTC,
    # slightly after the comments job so they don't start at the exact same time.
    - cron: "15 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without writing updates"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: youtube-metadata
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth-oauthlib
      - name: Restore OAuth token from secret
        env:
          YT_OAUTH_TOKEN_JSON: ${{ secrets.YT_OAUTH_TOKEN_JSON }}
        run: |
          if [ -z "$YT_OAUTH_TOKEN_JSON" ]; then
            echo "::error::Secret YT_OAUTH_TOKEN_JSON is not set."
            exit 1
          fi
          mkdir -p .secrets
          printf '%s' "$YT_OAUTH_TOKEN_JSON" > .secrets/youtube-token.json
      - name: Apply next batch of title/description updates
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/youtube_bulk_update_from_csv.py --csv seo-suggestions.csv --timestamps-source-json recovered-timestamps.json --dry-run
          else
            python scripts/youtube_bulk_update_from_csv.py --csv seo-suggestions.csv --timestamps-source-json recovered-timestamps.json --apply
          fi
      - name: Clean up token
        if: always()
        run: rm -f .secrets/youtube-token.json
