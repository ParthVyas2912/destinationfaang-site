name: Post support comment to YouTube videos

on:
  schedule:
    # YouTube API quota resets at midnight Pacific. Run daily at 09:00 UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview without posting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: youtube-comments
  cancel-in-progress: false

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-api-python-client google-auth-oauthlib
      - name: Restore OAuth token from secret
        env:
          YT_OAUTH_TOKEN_JSON: ${{ secrets.YT_OAUTH_TOKEN_JSON }}
        run: |
          if [ -z "$YT_OAUTH_TOKEN_JSON" ]; then
            echo "::error::Secret YT_OAUTH_TOKEN_JSON is not set."
            exit 1
          fi
          mkdir -p .secrets
          printf '%s' "$YT_OAUTH_TOKEN_JSON" > .secrets/youtube-token.json
      - name: Post next batch of comments
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/youtube_post_pinned_comment.py --dry-run
          else
            python scripts/youtube_post_pinned_comment.py --apply --no-remote-check
          fi
      - name: Commit progress
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          rm -f .secrets/youtube-token.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube-comment-history.json 2>/dev/null || true
          [ -f pin-checklist.csv ] && git add pin-checklist.csv || true
          if git diff --cached --quiet; then
            echo "No comment-progress changes."
          else
            git commit -m "chore: record YouTube support-comment progress"
            git pull --rebase
            git push
          fi
