# Deploy on human pushes, manual requests, and successful catalog refreshes.
# (Requires a PUBLIC repo on the free plan, or a paid plan for private repos.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh videos.json"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The refresh creates a commit after its original triggering SHA.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate branded catalog and pages
        run: python build_seo.py
      - name: Prepare website-only artifact
        run: |
          mkdir -p _site
          cp index.html about.html start-here.html resources.html 404.html \
            robots.txt sitemap.xml videos.json _site/
          cp -R assets v _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
