# Deploy the static site to GitHub Pages.
# NOTE: GitHub Pages requires either a PUBLIC repo or a paid plan (Pro/Team)
# for PRIVATE repos. While this repo is private on the free plan, Pages is
# disabled, so this workflow is set to manual-dispatch only to avoid failing
# on every push. Once Pages is available (repo made public, or plan upgraded),
# add `push: branches: [main]` back under `on:` to auto-deploy.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
